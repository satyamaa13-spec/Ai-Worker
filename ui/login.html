<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in</title>
<style>
:root{--bg:#fff;--card:#fff;--fg:#1c2330;--mut:#667085;--bd:#dfe3ea;--acc:#2f5bea;--bad:#b42318}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,Segoe UI,sans-serif}
form{width:min(360px,92vw);background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:28px 24px;display:grid;gap:14px}
h1{font-size:20px;margin:0 0 4px}
label{display:grid;gap:5px;font-size:12.5px;color:var(--mut)}
input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 10px;width:100%}
input:focus{outline:2px solid color-mix(in srgb,var(--acc) 35%,transparent);border-color:var(--acc)}
button{font:inherit;border:0;background:var(--acc);color:#fff;border-radius:8px;padding:10px;cursor:pointer;margin-top:4px}
button:disabled{opacity:.6;cursor:default}
#err{color:var(--bad);font-size:13px;min-height:18px;margin:0}
</style></head><body>
<form id="f">
  <h1>Sign in</h1>
  <label>Username <input id="u" autocomplete="username" autofocus required></label>
  <label>Password <input id="p" type="password" autocomplete="current-password" required></label>
  <p id="err"></p>
  <button id="go" type="submit">Log in</button>
</form>
<script>
// Sends the username and password to the server and reloads on success, or shows the error.
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();const b=document.getElementById('go'),err=document.getElementById('err');
  b.disabled=true;err.textContent='';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});
    if(r.ok){location.reload();return}
    err.textContent=(await r.json()).error||'Login failed.';
  }catch(x){err.textContent='Could not reach the server.'}
  b.disabled=false;
};
</script></body></html>
